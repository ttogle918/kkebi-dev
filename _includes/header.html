<header class="top">
  <div class="wrap bar">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="kkebi.dev 홈">
      <img src="{{ '/assets/img/kkebi-64.png' | relative_url }}" width="28" height="28" alt="kkebi" style="border-radius:7px">
      <span>kkebi.dev</span>
    </a>
    <nav class="links" aria-label="주 메뉴">
      <a href="{{ '/' | relative_url }}#posts"{% if page.url == '/' %} aria-current="page"{% endif %}>글</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>태그</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>소개</a>
      <a class="product" href="{{ site.product_url }}" rel="noopener">제품 (kkebi.app)</a>
    </nav>
  </div>
</header>
